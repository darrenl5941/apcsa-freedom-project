<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- <link href="style.css" rel="stylesheet" type="text/css" /> -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script> <!-- p5.js -->
        <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script> <!-- p5.sound -->
        <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script> <!-- ml5.js -->
        <style>
            /* CSS */
            
        </style>
        
        <title>Title</title>
    </head>
    <body>
        <!-- HTML -->
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <script src="script.js"></script> -->
        <script>
            // JS

            let video; // for the camera / webcam
            let handPose;
            let hands = [];

            async function setup() {
                console.log("ml5 version:", ml5.version);
                video = createCapture(VIDEO); // to access webcam
                video.size(640, 480); // controls size shown on screen later
                video.hide(); // prevent it from being put on screen too early

                handPose = await ml5.handPose();
                handPose.detectStart(video, gotHands);  // Start detecting hands in the webcam video

                createCanvas(1200, 800); // width, height
            }

            // Callback function to receive the detection results
            function gotHands(results) { // Store the detection results in the hands array

                hands = results;
            }     

            function draw() {
                background(640);
                
                image(video, 0, 0); // Draw the webcam video on the canvas

                // // Check if there is at least one hand detected
                // if (hands.length > 0) {
                //     // Get the index finger tip and thumb of the first hand (index: 0 in the array)
                //     let fingerX = hands[0].index_finger_tip.x;
                //     let fingerY = hands[0].index_finger_tip.y;
                    
                //     // Draw a yellow circle on the index finger tip
                //     noStroke();
                //     fill(255, 255, 0);
                //     circle(fingerX, fingerY, 20);
                // }

                // version that draws a point on every `keypoint` on the hand
                if(hands.length > 0) {
                    let hand = hands[0]; // get array of the first hand
                    fill(255, 0, 0);
                    noStroke();

                    for (let i = 0; i < hand.keypoints.length; i++) {
                        let point = hand.keypoints[i];
                        circle(point.x, point.y, 10);
                    }
                }
            }
            
        </script>
    </body>
</html>
